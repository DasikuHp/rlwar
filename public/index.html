<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphwar · Entrenador de redes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 13 Q7 -3 15 10' stroke='%233fd0ff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/lab.css">
<link rel="stylesheet" href="/css/game.css">
<link rel="stylesheet" href="/css/crear.css">
<link rel="stylesheet" href="/css/tutorial.css">
<link rel="stylesheet" href="/vendor/lenis@1.3.26/lenis.css">
</head>
<body class="lab game">
  <!-- portada: fluido WebGL al fondo, el plano con sus curvas, partículas, y delante el menú y la constelación de la reina -->
  <section class="portada" id="portada" hidden aria-label="Portada">
    <canvas class="fluid" id="fluid" aria-hidden="true"></canvas>
    <canvas class="bgfx" id="bgfx" aria-hidden="true"></canvas>
    <div class="pfx" id="pfx" aria-hidden="true"></div>
    <div>
      <h1 class="p-title">GRAPH<span>WAR</span></h1>
      <p class="p-sub">Entrenador de redes</p>
      <nav class="p-menu" id="menu" aria-label="Menú principal"></nav>
    </div>
    <figure class="p-queen" id="queen" aria-label="La red que reina en este mundo">
      <canvas id="queenCanvas"></canvas>
      <figcaption id="queenCaption"></figcaption>
    </figure>
    <p class="p-foot">Diseñas redes, las entrenas, crías hijas y miras sus duelos por el trono. Tú no disparas.</p>
  </section>

  <!-- el juego: 4 etapas -->
  <div id="game" hidden>
    <header class="g-top">
      <a class="g-brand" href="#portada">GRAPHWAR<span>.redes</span></a>
      <nav class="g-stages" id="stages" aria-label="Etapas"></nav>
      <div class="g-world"><span class="chip" id="worldChip"></span><button type="button" id="btnSettings" title="Ajustes">⚙ Ajustes</button></div>
    </header>
    <div class="g-head" id="stageHead"></div>
    <main class="g-body" id="view"></main>
  </div>

  <!-- ficha de red: sale por la derecha encima de la etapa; retraída, queda la lengüeta -->
  <aside class="ficha" id="ficha" hidden aria-label="Ficha de la red"></aside>

  <dialog class="g-dlg" id="dlgNew" aria-labelledby="dlgNewT"></dialog>
  <dialog class="g-dlg" id="dlgLoad" aria-labelledby="dlgLoadT"></dialog>
  <dialog class="g-dlg" id="dlgSettings" aria-labelledby="dlgSetT"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/game/main.js"></script>
</body>
</html>
